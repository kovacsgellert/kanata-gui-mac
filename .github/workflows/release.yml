name: Release

# Push a version tag like 0.1.0 to build the production binary and publish it
# as a downloadable GitHub Release asset:
#   git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  # Manual run from the Actions tab: builds only, no release is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon; asset is named accordingly. Also pinned off macos-14,
    # which is deprecated and whose default Xcode (15.4) is too old for
    # `@Environment(\.openSettings)` used by the Settings window.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release --product KanataGUI

      - name: Package .app + DMG + PKG
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Self-signed certificate (Scripts/make-signing-cert.sh) gives every
          # release the same identity. Releases must have it: an ad-hoc build
          # would look like a different app to macOS after each update.
          if [ -n "$SIGNING_P12_BASE64" ]; then
            export SIGNING_P12="$RUNNER_TEMP/signing.p12"
            echo "$SIGNING_P12_BASE64" | base64 --decode > "$SIGNING_P12"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "::error::SIGNING_P12_BASE64 secret is not set; refusing to publish an ad-hoc signed release"
            exit 1
          fi
          VERSION="${{ github.ref_name }}" ./scripts/package-app.sh
          ./scripts/make-dmg.sh
          VERSION="${{ github.ref_name }}" ./scripts/make-pkg.sh
          cp README.md LICENSE dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags with a hyphen suffix (e.g. 0.1.0-alpha1) become prereleases.
          FLAGS="--generate-notes"
          case "${{ github.ref_name }}" in *-*) FLAGS="$FLAGS --prerelease";; esac
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            $FLAGS \
            "dist/kanata-gui-${{ github.ref_name }}-macos-arm64.dmg" \
            "dist/kanata-gui-${{ github.ref_name }}-macos-arm64.pkg"
