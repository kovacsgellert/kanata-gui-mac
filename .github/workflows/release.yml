name: Release

# Push a version tag like 0.1.0 to build the production binary and publish it
# as a downloadable GitHub Release asset:
#   git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  # Manual run from the Actions tab: builds only, no release is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon; asset is named accordingly
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release --product KanataGUI

      - name: Package .app + DMG + PKG
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}" ./scripts/package-app.sh
          ./scripts/make-dmg.sh
          VERSION="${{ github.ref_name }}" ./scripts/make-pkg.sh
          cp README.md LICENSE dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags with a hyphen suffix (e.g. 0.1.0-alpha1) become prereleases.
          FLAGS="--generate-notes"
          case "${{ github.ref_name }}" in *-*) FLAGS="$FLAGS --prerelease";; esac
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            $FLAGS \
            "dist/kanata-gui-${{ github.ref_name }}-macos-arm64.dmg" \
            "dist/kanata-gui-${{ github.ref_name }}-macos-arm64.pkg"
